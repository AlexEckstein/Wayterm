[package]
name = "wayterm"
version = "0.1.0"
edition = "2021"
description = "An open source, multi-protocol connection manager and terminal for Linux"
license = "Apache-2.0"

[dependencies]
gtk4 = { version = "0.11", features = ["v4_14"] }
vte4 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gdk4 = "0.11.5"
gio = "0.22.10"

[dev-dependencies]
tempfile = "3"
