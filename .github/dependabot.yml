version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Minor/patch bumps ride one PR; major bumps stay separate for review.
      rust-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Held at 0.6.0 (see the Cargo.toml comment and doc 08): 0.6.1 adds
      # only features Wayterm does not use and pulls in the previous
      # RustCrypto generation. Later releases are still proposed.
      - dependency-name: "vnc-rs"
        versions: ["0.6.1"]
    commit-message:
      prefix: "chore"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore"