name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # weekly cargo audit (Fri 09:17 UTC, off-peak)
    - cron: "17 9 * * 5"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  detect:
    name: Detect project structure
    runs-on: ubuntu-latest
    outputs:
      has_rust: ${{ steps.detect.outputs.has_rust }}
      has_lock: ${{ steps.detect.outputs.has_lock }}
    steps:
      - uses: actions/checkout@v7
      - name: Which components exist
        id: detect
        run: |
          if [ -f Cargo.toml ]; then
            echo "has_rust=true"  >> "$GITHUB_OUTPUT"
          else
            echo "has_rust=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f Cargo.lock ]; then
            echo "has_lock=true"  >> "$GITHUB_OUTPUT"
          else
            echo "has_lock=false" >> "$GITHUB_OUTPUT"
          fi

  docs:
    name: Docs — cross-reference check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate relative links across design docs
        run: |
          python3 - <<'EOF'
          import os, re, sys

          md_files = []
          for root, _, files in os.walk("."):
              if ".git" in root:
                  continue
              for f in files:
                  if f.endswith(".md"):
                      md_files.append(os.path.join(root, f))

          # relative markdown links: [text](target.md) or [text](target.md#anchor)
          link_re = re.compile(r"\[[^\]]*\]\(([^)]+?)(?:#[^)]*)?\)")
          broken = []
          for src in md_files:
              text = open(src, encoding="utf-8").read()
              for m in link_re.finditer(text):
                  target = m.group(1)
                  if target.startswith(("http://", "https://", "mailto:", "#")):
                      continue
                  resolved = os.path.normpath(os.path.join(os.path.dirname(src), target))
                  if not os.path.exists(resolved):
                      broken.append(f"{src}: -> {target}")

          if broken:
              print("BROKEN LINKS:")
              print("\n".join(broken))
              sys.exit(1)
          print(f"OK: all relative links resolve across {len(md_files)} markdown files")
          EOF

  rust:
    name: Rust fmt / clippy / test (+ sshd)
    runs-on: ubuntu-latest
    needs: [detect]
    # job-level hashFiles() is unavailable before checkout, hence `detect`
    if: needs.detect.outputs.has_rust == 'true'
    env:
      # Full debug info makes each GTK test binary ~280 MB, and the ~20 of
      # them filled the runner's disk (`ld` bus errors, "No space left on
      # device"). Line tables keep file:line in panics and backtraces.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      # Preinstalled toolchains this job never uses take well over 10 GB.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v7

      - name: Install GTK4 / VTE build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libvte-2.91-gtk4-dev \
            libsqlite3-dev libsecret-1-dev \
            openssh-server xvfb

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      # Unit, display-free integration, and doc tests; the sshd-gated suites
      # skip themselves until SSH_TEST_* is provisioned below.
      - name: Tests
        run: cargo test

      - name: VTE search test (xvfb)
        run: xvfb-run -a cargo test --test vte_search -- --ignored

      # ── Transport integration tests against a real sshd (doc 15) ──
      - name: Provision test sshd
        run: |
          sudo useradd -m -s /bin/bash wayterm-test
          PASS=$(openssl rand -hex 16)
          echo "wayterm-test:$PASS" | sudo chpasswd
          sudo ssh-keygen -A
          sudo mkdir -p /home/wayterm-test/.ssh
          ssh-keygen -t ed25519 -N "" -f "$HOME/test_key" -C wayterm-ci
          sudo cp "$HOME/test_key.pub" /home/wayterm-test/.ssh/authorized_keys
          sudo chown -R wayterm-test:wayterm-test /home/wayterm-test/.ssh
          sudo chmod 700 /home/wayterm-test/.ssh
          sudo chmod 600 /home/wayterm-test/.ssh/authorized_keys
          # sshd keeps the first value it reads, and some images turn password
          # auth off in an sshd_config.d drop-in included at the top, so an
          # in-place edit loses: put both options on the config's first lines.
          sudo sed -i '1i PasswordAuthentication yes\nKbdInteractiveAuthentication yes' /etc/ssh/sshd_config
          # The image may ship sshd already running on its own config, where
          # `start` is a no-op: restart, then check what sshd will serve.
          sudo systemctl restart ssh
          for opt in passwordauthentication kbdinteractiveauthentication; do
            sudo sshd -T | grep -qix "$opt yes" || {
              echo "::error::test sshd has $opt off"
              sudo grep -rni "$opt" /etc/ssh/sshd_config /etc/ssh/sshd_config.d/ || true
              exit 1
            }
          done
          # Export for the test step via GITHUB_ENV (ephemeral, throwaway creds)
          echo "SSH_TEST_HOST=127.0.0.1" >> "$GITHUB_ENV"
          echo "SSH_TEST_PORT=22"        >> "$GITHUB_ENV"
          echo "SSH_TEST_USER=wayterm-test" >> "$GITHUB_ENV"
          echo "SSH_TEST_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "SSH_TEST_KEY_PATH=$HOME/test_key" >> "$GITHUB_ENV"
          chmod 600 "$HOME/test_key"

      - name: Integration tests (real sshd)
        run: cargo test --test transport_sshd -- --test-threads=1

  ghostty:
    name: Ghostty backend clippy / test (+ xvfb)
    runs-on: ubuntu-latest
    needs: [detect]
    if: needs.detect.outputs.has_rust == 'true'
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      # The libghostty-vt pin (doc 02 §libghostty-vt pin); a bump changes
      # it here, in build.rs and in the doc together.
      GHOSTTY_VT_VERSION: 1.0.0
      GHOSTTY_VT_SHA256: 4a6ef758be721923e1969e7b81b443dcc92d8dd3fb5a39600c03a8817a753676
      GHOSTTY_VT_DEPS_SHA256: 4d5ea5e448e4c7ea8fb55ccbaa8668f2a97d44f438cee831e2b7ecd162d85c29
      ZIG_VERSION: 0.17.0
      ZIG_SHA256: 1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026
      # Zig builds for the CPU it runs on unless told otherwise, and the
      # cached library is restored on runners with older CPUs, where such
      # a build dies with SIGILL. `baseline` runs on every x86_64.
      GHOSTTY_VT_CPU: baseline
    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v7

      - name: Check the pin matches build.rs and doc 02
        run: |
          for f in build.rs docs/02-terminal.md; do
            grep -q "$GHOSTTY_VT_SHA256" "$f" || {
              echo "::error file=$f::does not pin libghostty-vt $GHOSTTY_VT_VERSION ($GHOSTTY_VT_SHA256) like ci.yml"
              exit 1
            }
          done

      - name: Install GTK4 / VTE build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libvte-2.91-gtk4-dev \
            libsqlite3-dev libsecret-1-dev \
            xvfb

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Built once per pin and target CPU into build.rs's default
      # location; Zig and the release tarballs are only downloaded on a
      # cache miss.
      - name: Cache libghostty-vt
        id: libghostty-vt
        uses: actions/cache@v6
        with:
          path: third_party/libghostty-vt
          key: libghostty-vt-${{ runner.os }}-${{ env.GHOSTTY_VT_SHA256 }}-zig-${{ env.ZIG_VERSION }}-cpu-${{ env.GHOSTTY_VT_CPU }}

      - name: Build libghostty-vt
        if: steps.libghostty-vt.outputs.cache-hit != 'true'
        run: |
          cd "$RUNNER_TEMP"
          tarball="zig-x86_64-linux-$ZIG_VERSION.tar.xz"
          curl -fsSLO "https://ziglang.org/download/$ZIG_VERSION/$tarball"
          echo "$ZIG_SHA256  $tarball" | sha256sum -c -
          tar -xJf "$tarball"
          src="libghostty-vt-$GHOSTTY_VT_VERSION"
          base="https://release.files.ghostty.org/libghostty-vt/$GHOSTTY_VT_VERSION"
          curl -fsSLO "$base/$src.tar.gz"
          curl -fsSLO "$base/$src-deps.tar.gz"
          echo "$GHOSTTY_VT_SHA256  $src.tar.gz" | sha256sum -c -
          echo "$GHOSTTY_VT_DEPS_SHA256  $src-deps.tar.gz" | sha256sum -c -
          tar -xzf "$src.tar.gz"
          tar -xzf "$src-deps.tar.gz"
          cd "$src"
          # Offline: packages come from the dependency tarball, into a
          # cache that must start empty.
          ZIG_GLOBAL_CACHE_DIR="$RUNNER_TEMP/zig-cache" \
            "$RUNNER_TEMP/zig-x86_64-linux-$ZIG_VERSION/zig" build \
            --system "../$src-deps" -Doptimize=ReleaseFast \
            -Dcpu="$GHOSTTY_VT_CPU" \
            --prefix "$RUNNER_TEMP/ghostty-out"
          vt="$GITHUB_WORKSPACE/third_party/libghostty-vt"
          mkdir -p "$vt/lib"
          cp -r "$RUNNER_TEMP/ghostty-out/include" "$vt/"
          cp "$RUNNER_TEMP/ghostty-out/lib/libghostty-vt.a" "$vt/lib/"

      - name: Clippy with backend-ghostty (deny warnings)
        run: cargo clippy --all-targets --features backend-ghostty -- -D warnings

      - name: Tests with backend-ghostty
        run: cargo test --features backend-ghostty

      - name: Ghostty widget test (xvfb)
        run: xvfb-run -a cargo test --features backend-ghostty -- --ignored ghostty_display

      # A SIGILL above means a binary built for another runner's CPU.
      - name: Runner CPU (on failure)
        if: failure()
        run: grep -m2 -E '^(model name|flags)' /proc/cpuinfo

  audit:
    name: Cargo audit (weekly advisory sweep)
    runs-on: ubuntu-latest
    needs: [detect]
    if: github.event_name == 'schedule' && needs.detect.outputs.has_lock == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}