name: Release

# Tag push `v*` builds the .deb, the AppImage, the Arch package and the RPM
# and attaches them to the GitHub Release for that tag. workflow_dispatch builds
# the artifacts only; the release job runs for tag refs alone.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Read-only by default: only the job that publishes gets a token that can
# write, and it runs no build.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The tag names the release; Cargo.toml versions the package. Fail
      # before building anything if the two disagree.
      - name: Fail unless the tag matches Cargo.toml's version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ver="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          if [ "$ver" != "${{ github.ref_name }}" ]; then
            echo "tag ${{ github.ref_name }} does not match Cargo.toml version $ver" >&2
            exit 1
          fi

      - name: Install GTK4 / VTE build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libvte-2.91-gtk4-dev libsqlite3-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-deb
        run: cargo install --locked cargo-deb --version 3.8.0

      - name: Build .deb
        run: cargo deb --locked

      - uses: actions/upload-artifact@v7
        with:
          name: deb
          path: target/debian/*.deb
          if-no-files-found: error
          overwrite: true

  appimage:
    runs-on: ubuntu-latest
    needs: [deb]
    env:
      # pkg2appimage publishes only a `continuous` tag. The asset name
      # carries the commit, but an asset can be replaced under its name, so
      # the checksum is what pins the tool.
      PKG2APPIMAGE_URL: https://github.com/AppImageCommunity/pkg2appimage/releases/download/continuous/pkg2appimage-1eceb30-x86_64.AppImage
      PKG2APPIMAGE_SHA256: 6f74ec26ba14d2d8f1857d150704f9d585dae30b1ca30ce46f375c157b71d07d
      # No FUSE on the runner.
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: deb
          path: dist

      # What pkg2appimage checks for; ubuntu-latest no longer ships convert.
      - name: Install pkg2appimage tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            imagemagick desktop-file-utils file wget binutils

      - name: Fetch pkg2appimage
        run: |
          curl -fsSL -o pkg2appimage "$PKG2APPIMAGE_URL"
          echo "$PKG2APPIMAGE_SHA256  pkg2appimage" | sha256sum -c -
          chmod +x pkg2appimage

      # pkg2appimage exports LD_LIBRARY_PATH for its own older libraries,
      # and the host's glib-compile-schemas cannot load against them.
      - name: Build AppImage
        run: |
          rm -rf wayterm out
          shim="$RUNNER_TEMP/shim"
          mkdir -p "$shim"
          printf '#!/bin/sh\nexec env -u LD_LIBRARY_PATH /usr/bin/glib-compile-schemas "$@"\n' \
            > "$shim/glib-compile-schemas"
          chmod +x "$shim/glib-compile-schemas"
          PATH="$shim:$PATH" WAYTERM_DEB="$(readlink -f dist/*.deb)" \
            ./pkg2appimage packaging/appimage/wayterm.yml

      - uses: actions/upload-artifact@v7
        with:
          name: appimage
          path: out/*.AppImage
          if-no-files-found: error
          overwrite: true

  arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      # git before checkout, so the checkout is a repository makepkg can clone.
      - name: Install build tools
        run: pacman -Syu --noconfirm --needed base-devel git

      - uses: actions/checkout@v7

      # makepkg refuses to run as root.
      - name: Build the package
        run: |
          useradd -m builder
          chown -R builder: "$GITHUB_WORKSPACE"
          cd packaging/arch
          source ./PKGBUILD
          pacman -S --noconfirm --needed "${depends[@]}" "${makedepends[@]}"
          su builder -c 'makepkg --noconfirm'

      - uses: actions/upload-artifact@v7
        with:
          name: arch
          path: packaging/arch/*.pkg.tar.zst
          if-no-files-found: error
          overwrite: true

  rpm:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      # git before checkout, so the checkout is a repository build.sh can clone.
      - name: Install build tools
        run: dnf install -y git-core rpm-build 'dnf-command(builddep)'

      - uses: actions/checkout@v7

      - name: Build the package
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          dnf builddep -y -D 'wayterm_version 0' packaging/rpm/wayterm.spec
          packaging/rpm/build.sh

      # What a reviewer would check by hand, kept in the job log.
      - name: Show the package
        run: |
          rpm -qpil target/rpm/RPMS/x86_64/*.rpm
          rpm -qp --requires --recommends --suggests target/rpm/RPMS/x86_64/*.rpm

      - uses: actions/upload-artifact@v7
        with:
          name: rpm
          path: target/rpm/RPMS/x86_64/*.rpm
          if-no-files-found: error
          overwrite: true

  release:
    runs-on: ubuntu-latest
    needs: [deb, appimage, arch, rpm]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create or update the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.deb
            dist/*.AppImage
            dist/*.pkg.tar.zst
            dist/*.rpm
          fail_on_unmatched_files: true
          generate_release_notes: true
